name: Build Windows Executable

on:
  push:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
    tags:
      - 'v*'   # trigger on version tags like v1.0, v2.1.3

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      - name: Compile source code
        run: |
          mkdir build
          gcc src/djifix.c -o build/djifix.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/djifix.exe

      # Create a GitHub Release (only on tag)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/djifix.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
